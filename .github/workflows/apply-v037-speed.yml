name: Apply v0.3.7 speed stabilization

on:
  push:
    paths:
      - 'v037-speed.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/apply_v037_speed.py
      - name: Verify syntax
        run: python -m py_compile RenPyAIPatcher.py
      - name: Run source self-test
        run: python RenPyAIPatcher.py --self-test
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RenPyAIPatcher.py installer.iss
          git commit -m "Stabilize fast Google translation in v0.3.7" || exit 0
          git push
