name: Build Windows Installer

on:
  workflow_run:
    workflows: ["RenPy Tools Preflight"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: renpytools-installer-main
  cancel-in-progress: true

jobs:
  build:
    # Normal push builds only start after the separate preflight workflow passed.
    # workflow_dispatch remains available as an explicit manual override.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install "git+https://github.com/regiellis/rpa-toolkit.git"

      - name: Manual-dispatch preflight
        if: github.event_name == 'workflow_dispatch'
        shell: powershell
        run: |
          python ci_preflight.py
          if ($LASTEXITCODE -ne 0) { throw "Manual installer preflight failed" }

      - name: Download bundled Korean font and license
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "bundled_fonts" | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/google/fonts/main/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf" -OutFile "bundled_fonts/NotoSansKR.ttf"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/google/fonts/main/ofl/notosanskr/OFL.txt" -OutFile "bundled_fonts/NotoSansKR-OFL.txt"
          if ((Get-Item "bundled_fonts/NotoSansKR.ttf").Length -lt 1000000) { throw "NotoSansKR.ttf download looks invalid" }
          if (!(Test-Path "bundled_fonts/NotoSansKR-OFL.txt")) { throw "Noto Sans KR OFL license missing" }

      - name: Build RenPyExtractor
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --collect-all rpatool --name RenPyExtractor RenPyExtractor.py

      - name: Build RenPyAIPatcher
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --collect-all rpatool --add-data "bundled_fonts;bundled_fonts" --name RenPyAIPatcher RenPyToolsCurrent.py

      - name: Run built Patcher EXE self-test
        shell: powershell
        run: |
          $proc = Start-Process -FilePath ".\dist\RenPyAIPatcher.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            Get-ChildItem -Path . -Filter "RenPyTools*-error.txt" -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "--- $($_.Name) ---"
              Get-Content $_.FullName
            }
            if (Test-Path "RenPyAIPatcher-selftest-error.txt") { Get-Content "RenPyAIPatcher-selftest-error.txt" }
            throw "Built RenPyAIPatcher.exe self-test failed with exit code $($proc.ExitCode)"
          }

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build standalone patch installer stub
        shell: cmd
        run: |
          cl /nologo /std:c++17 /O2 /EHsc RenPyPatchInstallerStubV0513.cpp /Fe:dist\RenPyPatchInstallerStub.exe /link /SUBSYSTEM:WINDOWS shell32.lib ole32.lib user32.lib

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Setup EXE
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Verify Setup EXE
        shell: powershell
        run: |
          if (!(Test-Path "installer\RenPyTools_Setup.exe")) { throw "RenPyTools_Setup.exe was not created" }
          if (!(Test-Path "dist\RenPyPatchInstallerStub.exe")) { throw "RenPyPatchInstallerStub.exe was not created" }

      - name: Upload Setup EXE
        uses: actions/upload-artifact@v4
        with:
          name: RenPyTools-Setup-Windows-x64
          path: installer/RenPyTools_Setup.exe
