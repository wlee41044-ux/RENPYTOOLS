name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install "git+https://github.com/regiellis/rpa-toolkit.git"

      - name: Build RenPyExtractor
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --collect-all rpatool --name RenPyExtractor RenPyExtractor.py

      - name: Core source self-test on Windows
        shell: powershell
        run: |
          python RenPyAIPatcher.py --self-test
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path "RenPyAIPatcher-selftest-error.txt") { Get-Content "RenPyAIPatcher-selftest-error.txt" }
            throw "RenPyAIPatcher core source self-test failed"
          }

      - name: UI workflow self-test on Windows
        shell: powershell
        run: |
          python RenPyToolsLauncherV048.py --self-test
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path "RenPyTools-v048-selftest-error.txt") { Get-Content "RenPyTools-v048-selftest-error.txt" }
            if (Test-Path "RenPyToolsUI-selftest-error.txt") { Get-Content "RenPyToolsUI-selftest-error.txt" }
            throw "RenPyToolsLauncherV048 source self-test failed"
          }

      - name: Build RenPyAIPatcher
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onefile --collect-all rpatool --name RenPyAIPatcher RenPyToolsLauncherV048.py

      - name: Run built Patcher EXE self-test
        shell: powershell
        run: |
          $proc = Start-Process -FilePath ".\dist\RenPyAIPatcher.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            if (Test-Path "RenPyTools-v048-selftest-error.txt") { Get-Content "RenPyTools-v048-selftest-error.txt" }
            if (Test-Path "RenPyToolsUI-selftest-error.txt") { Get-Content "RenPyToolsUI-selftest-error.txt" }
            if (Test-Path "RenPyAIPatcher-selftest-error.txt") { Get-Content "RenPyAIPatcher-selftest-error.txt" }
            throw "Built RenPyAIPatcher.exe self-test failed with exit code $($proc.ExitCode)"
          }

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build standalone patch installer stub
        shell: cmd
        run: |
          cl /nologo /std:c++17 /O2 /EHsc RenPyPatchInstallerStub.cpp /Fe:dist\RenPyPatchInstallerStub.exe /link /SUBSYSTEM:WINDOWS shell32.lib ole32.lib user32.lib

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Setup EXE
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Verify Setup EXE
        shell: powershell
        run: |
          if (!(Test-Path "installer\RenPyTools_Setup.exe")) {
            throw "RenPyTools_Setup.exe was not created"
          }
          if (!(Test-Path "dist\RenPyPatchInstallerStub.exe")) {
            throw "RenPyPatchInstallerStub.exe was not created"
          }

      - name: Upload Setup EXE
        uses: actions/upload-artifact@v4
        with:
          name: RenPyTools-Setup-Windows-x64
          path: installer/RenPyTools_Setup.exe
