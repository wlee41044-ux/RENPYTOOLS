name: Apply v0.3.2 language activation hotfix

on:
  workflow_dispatch:
  push:
    paths:
      - v032.trigger

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply v0.3.2 patch
        run: python tools/apply_v032.py
      - name: Commit v0.3.2 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RenPyAIPatcher.py RenPyPatchInstallerStub.cpp installer.iss
          git diff --cached --quiet && exit 0
          git commit -m "Fix translation activation in v0.3.2"
          git push
