name: Apply v0.3.6 MyMemory speed patch

on:
  workflow_dispatch:
  push:
    paths:
      - 'v036.speed.trigger'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.3.6 patch
        run: python tools/apply_v036.py

      - name: Commit v0.3.6 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RenPyAIPatcher.py installer.iss .github/workflows/build-windows.yml
          git diff --cached --check
          git commit -m "Speed up MyMemory and add Windows EXE self-test in v0.3.6"
          git push
