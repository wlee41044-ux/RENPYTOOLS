name: Apply v0.3.6 MyMemory speed patch

on:
  workflow_dispatch:
  push:
    paths:
      - 'v036.speed.trigger'
      - 'v036.speed2.trigger'
      - 'v036.selftestfix.trigger'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.3.6 self-test fix
        run: python tools/fix_v036_selftest.py

      - name: Commit v0.3.6 fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RenPyAIPatcher.py
          git diff --cached --check
          git commit -m "Fix v0.3.6 Windows self-test expectation"
          git push