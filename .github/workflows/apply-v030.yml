name: Apply v0.3.0 source upgrade

on:
  push:
    paths:
      - "v030.trigger"

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v0.3.0 patch
        run: |
          python3 tools/apply_v030.py
          python3 -m py_compile RenPyAIPatcher.py

      - name: Commit v0.3.0 source
        run: |
          git config user.name "wlee41044-ux"
          git config user.email "wlee41044@gmail.com"
          git add RenPyAIPatcher.py
          git commit -m "Upgrade AI Patcher to v0.3.0 standalone patches"
          git push
