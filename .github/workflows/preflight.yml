name: RenPy Tools Preflight

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: renpytools-preflight-main
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/regiellis/rpa-toolkit.git"

      - name: Run isolated preflight
        shell: powershell
        run: |
          python ci_preflight.py
          if ($LASTEXITCODE -ne 0) { throw "RenPy Tools preflight failed" }
